<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice" width="1920" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9fec"/>
      <stop offset="0.6" stop-color="#78bcf4"/>
      <stop offset="1" stop-color="#9fd2f8"/>
    </linearGradient>

    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7fd0"/>
      <stop offset="1" stop-color="#2f6cc0"/>
    </linearGradient>

    <radialGradient id="grass" cx="50%" cy="70%" r="75%">
      <stop offset="0" stop-color="#e4f27a"/>
      <stop offset="0.45" stop-color="#b9de57"/>
      <stop offset="0.8" stop-color="#8fc443"/>
      <stop offset="1" stop-color="#6c9f4a"/>
    </radialGradient>

    <linearGradient id="hillTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6cc0" stop-opacity="0.35"/>
      <stop offset="0.25" stop-color="#2f6cc0" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="60%" r="75%">
      <stop offset="0.6" stop-color="#1c3b10" stop-opacity="0"/>
      <stop offset="1" stop-color="#1c3b10" stop-opacity="0.35"/>
    </radialGradient>

    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blurCloud" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurBokeh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="speckle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.55" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.12
                0 0 0 0 0.32
                0 0 0 0 0.05
                0 0 0 -2.2 1.35"/>
    </filter>
    <filter id="blotch" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="3" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0 0.35
                0 0 0 -2.4 1.25"/>
    </filter>

    <clipPath id="hillClip">
      <ellipse cx="960" cy="1400" rx="1440" ry="1110"/>
    </clipPath>

    <symbol id="block" viewBox="0 0 100 300" overflow="visible">
      <polygon points="0,40 70,40 70,300 0,300" fill="currentColor"/>
      <polygon points="70,40 100,22 100,282 70,300" fill="#0b2a6b" opacity="0.18"/>
      <polygon points="0,40 30,22 100,22 70,40" fill="#fff" opacity="0.30"/>
    </symbol>

    <symbol id="tuft" viewBox="0 0 40 30" overflow="visible">
      <path d="M4 30 C5 18 3 10 0 4 C8 10 10 20 10 30z" fill="#5f9a2c"/>
      <path d="M12 30 C12 16 14 8 18 0 C22 9 21 20 20 30z" fill="#79b236"/>
      <path d="M22 30 C24 20 27 12 34 6 C32 16 31 24 30 30z" fill="#5f9a2c"/>
      <path d="M30 30 C32 24 35 20 40 18 C37 24 36 28 36 30z" fill="#8cc243"/>
    </symbol>

    <pattern id="blades" width="70" height="56" patternUnits="userSpaceOnUse">
      <path d="M8 20 q2 -8 -1 -14 q6 4 5 14z" fill="#4f8a22" opacity="0.28"/>
      <path d="M40 46 q2 -9 -2 -16 q7 5 6 16z" fill="#fff59a" opacity="0.30"/>
      <path d="M58 14 q1 -6 -2 -10 q5 3 4 10z" fill="#4f8a22" opacity="0.22"/>
      <path d="M24 52 q1 -5 -1 -9 q5 3 4 9z" fill="#fff59a" opacity="0.22"/>
    </pattern>

    <filter id="cardShadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1b3a0c" flood-opacity="0.45"/></filter>
    <filter id="skyBlur"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- SKY -->
  <rect width="1920" height="1000" fill="url(#sky)"/>


  <!-- Soft clouds -->
  <g fill="#fff" filter="url(#blurCloud)" opacity="0.85">
    <ellipse cx="330" cy="60"  rx="260" ry="60"/>
    <ellipse cx="470" cy="150" rx="200" ry="45"/>
    <ellipse cx="1000" cy="30" rx="240" ry="50"/>
    <ellipse cx="1500" cy="90" rx="200" ry="46"/>
    <ellipse cx="1760" cy="210" rx="220" ry="55"/>
    <ellipse cx="120" cy="260" rx="200" ry="45"/>
    <ellipse cx="800" cy="260" rx="170" ry="30" opacity="0.7"/>
  </g>

</svg>
