name: Deploy backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/game-engine/**'
      - 'scripts/build-cpanel.sh'
      - '.github/workflows/cpanel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build cPanel bundle
        run: ./scripts/build-cpanel.sh

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.prakashraz.com
          username: unobreak.prakashraz.com
          password: QKkmrP7B2NMjK?%q
          local-dir: ./deploy/backend/
          server-dir: prakashraz.com/unobreak/
